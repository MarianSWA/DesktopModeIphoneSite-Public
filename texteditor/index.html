<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Text Editor</title>
<link rel="manifest" href="/texteditor/manifest.webmanifest">
<link rel="icon" href="/texteditor/icon.svg" type="image/svg+xml">
<!--
  Text Editor: a tiny web app that opens and saves files with nothing but web standards.

    File Handling API        launchQueue.setConsumer(…)      files the system opens in the app
                             manifest.webmanifest file_handlers   the types it opens
    File System Access API   showOpenFilePicker()            Open
                             showSaveFilePicker()            Save As
                             handle.getFile()                read a file
                             handle.createWritable()         Save
    HTML                     beforeunload                    unsaved changes

  Where those APIs are missing it still works: a file input to open, a download to save.
-->
<style>
  :root { color-scheme: light dark; --bg: #fff; --bar: #f3f3f5; --line: #dcdce0; --text: #1d1d1f; --dim: #86868b; --accent: #0a84ff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --bar: #2c2c2e; --line: #3a3a3c; --text: #f5f5f7; --dim: #98989d; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 13px -apple-system, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--bar); border-bottom: 1px solid var(--line); }
  button { font: inherit; padding: 5px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); }
  button:active { background: var(--line); }
  #name { margin-left: 8px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); visibility: hidden; flex: none; }
  #dot.on { visibility: visible; }
  #status { margin-left: auto; color: var(--dim); white-space: nowrap; }
  textarea { flex: 1; width: 100%; padding: 14px 16px; border: 0; outline: 0; resize: none; background: var(--bg); color: var(--text); font: 14px/1.5 ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <button id="new">New</button>
  <button id="open">Open</button>
  <button id="save">Save</button>
  <button id="saveas">Save As</button>
  <span id="name">Untitled.txt</span><span id="dot"></span>
  <span id="status"></span>
</header>
<textarea id="text" spellcheck="false"></textarea>
<script>
(function () {
  const canPick = "showOpenFilePicker" in window && "showSaveFilePicker" in window;
  const types = [{ description: "Text", accept: { "text/plain": [".txt", ".md", ".csv", ".json", ".log"] } }];

  const text = document.getElementById("text");
  const nameEl = document.getElementById("name");
  const dot = document.getElementById("dot");
  const status = document.getElementById("status");

  let handle = null;      // the file being edited (null = Untitled)
  let name = "Untitled.txt";
  let edited = false;

  function setEdited(value) {
    edited = value;
    dot.classList.toggle("on", value);
  }
  function show(message) {
    status.textContent = message;
    clearTimeout(show.t);
    show.t = setTimeout(() => { status.textContent = ""; }, 2500);
  }
  function adopt(fileHandle, fileName, contents) {
    handle = fileHandle;
    name = fileName;
    nameEl.textContent = name;
    document.title = name + " — Text Editor";
    if (contents !== undefined) text.value = contents;
    setEdited(false);
  }
  const cancelled = (e) => e && e.name === "AbortError";

  async function openHandle(fileHandle) {
    const file = await fileHandle.getFile();
    adopt(fileHandle, file.name, await file.text());
    show("Opened");
  }

  async function write(fileHandle) {
    const writable = await fileHandle.createWritable();
    await writable.write(text.value);
    await writable.close();
  }

  async function saveAs() {
    if (!canPick) { download(); return true; }
    try {
      const target = await showSaveFilePicker({ suggestedName: name, types });
      await write(target);
      adopt(target, target.name);
      show("Saved");
      return true;
    } catch (e) {
      if (!cancelled(e)) show("Couldn't save: " + e.message);
      return false;
    }
  }

  async function save() {
    if (!handle) return saveAs();
    try {
      await write(handle);
      setEdited(false);
      show("Saved");
      return true;
    } catch (e) {
      show("Couldn't save: " + e.message);
      return false;
    }
  }

  async function open() {
    if (!canPick) { pickLocally(); return; }
    try {
      const [fileHandle] = await showOpenFilePicker({ types });
      await openHandle(fileHandle);
    } catch (e) {
      if (!cancelled(e)) show("Couldn't open: " + e.message);
    }
  }

  function newDocument() {
    adopt(null, "Untitled.txt", "");
    document.title = "Text Editor";
    text.focus();
  }

  // Without the File System Access API: an ordinary file input and a download.
  function pickLocally() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".txt,.md,.csv,.json,.log,text/plain";
    input.onchange = async () => {
      const f = input.files[0];
      if (f) adopt(null, f.name, await f.text());
    };
    input.click();
  }
  function download() {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text.value], { type: "text/plain" }));
    a.download = name;
    a.click();
    setEdited(false);
  }

  // Files opened in this app from outside it (Open With, a double-click when it's the default).
  if ("launchQueue" in window) {
    launchQueue.setConsumer((params) => {
      if (params.files && params.files.length) openHandle(params.files[0]);
    });
  }

  text.addEventListener("input", () => { if (!edited) setEdited(true); });
  document.getElementById("new").onclick = newDocument;
  document.getElementById("open").onclick = open;
  document.getElementById("save").onclick = save;
  document.getElementById("saveas").onclick = saveAs;
  document.addEventListener("keydown", (e) => {
    if (!(e.metaKey || e.ctrlKey)) return;
    const key = e.key.toLowerCase();
    if (key === "s") { e.preventDefault(); e.shiftKey ? saveAs() : save(); }
    else if (key === "o") { e.preventDefault(); open(); }
  });
  // Unsaved changes: the browser (or the system) asks before this page is closed.
  window.addEventListener("beforeunload", (e) => {
    if (!edited) return;
    e.preventDefault();
    e.returnValue = "";
  });
})();
</script>
</body>
</html>
